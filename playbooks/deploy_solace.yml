---
- name: Dynamic File-Driven Solace Provisioning Engine
  hosts: solace_brokers
  gather_facts: no
  connection: local
  vars:
    # Searches for JSON files relative to where the playbook is run
    config_files: "{{ lookup('fileglob', '../configs/*.json', wantlist=True) }}"

  tasks:
    - name: Fail if no configuration files are found
      ansible.builtin.fail:
        msg: "No JSON payload files located inside the configs/ directory structure."
      when: config_files | length == 0

    - name: Process Staged Configuration Profiles Loop
      # ADDED 'playbooks/' PREFIX HERE SO ANSIBLE CAN FIND THE COMPANION FILE NATIVELY
      ansible.builtin.include_tasks: playbooks/inner_provision.yml
      loop: "{{ config_files }}"
      loop_control:
        loop_var: file_path
