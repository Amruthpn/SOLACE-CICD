---
- name: Extract metadata and JSON payload content
  ansible.builtin.set_fact:
    file_name: "{{ file_path | basename }}"
    json_data: "{{ lookup('file', file_path) | from_json }}"

- name: Skip file if required keys are missing
  ansible.builtin.debug:
    msg: "SKIPPING {{ file_name }} — missing required 'vpn_name' or 'queue_name'"
  when: json_data.vpn_name is not defined or json_data.queue_name is not defined

# ==========================================
# 1. CREATE — new queue with full parameter set
# ==========================================
- name: "[CREATE] Ensure queue is provisioned"
  ansible.builtin.uri:
    url: "http://{{ ansible_host }}:{{ semp_port }}/SEMP/v2/config/msgVpns/{{ json_data.vpn_name }}/queues"
    method: POST
    user: "{{ semp_user }}"
    password: "{{ semp_pass }}"
    force_basic_auth: yes
    body_format: json
    body:
      queueName: "{{ json_data.queue_name }}"
      ingressEnabled: "{{ json_data.ingress_enabled | default(true) }}"
      egressEnabled: "{{ json_data.egress_enabled | default(true) }}"
      accessType: "{{ json_data.access_type | default('exclusive') }}"
      permission: "{{ json_data.permission | default('consume') }}"
      maxSpoolUsage: "{{ json_data.max_spool_usage_mb | default(2000) }}"
      maxMsgSize: "{{ json_data.max_msg_size_bytes | default(10485760) }}"
      maxTtl: "{{ json_data.max_ttl_seconds | default(0) }}"
      respectTtlEnabled: "{{ json_data.respect_ttl | default(false) }}"
      maxRedeliveryCount: "{{ json_data.max_redelivery_count | default(0) }}"
      redeliveryEnabled: "{{ json_data.redelivery_enabled | default(true) }}"
      deadMsgQueue: "{{ json_data.dead_letter_queue | default(omit) }}"
      rejectMsgToSenderOnDiscardBehavior: "{{ json_data.reject_msg_to_sender_on_discard | default('when-queue-enabled') }}"
      partitionCount: "{{ json_data.partition_count | default(omit) }}"
      owner: "{{ json_data.owner | default(omit) }}"
    status_code: [200, 400]
  when:
    - "'CREATE' in file_name"
    - json_data.vpn_name is defined
    - json_data.queue_name is defined
  register: create_result

- name: "[CREATE] Report result"
  ansible.builtin.debug:
    msg: "{{ file_name }}: HTTP {{ create_result.status }} — {{ create_result.json | default(create_result.content) | default('no body') }}"
  when: create_result is defined and create_result.status is defined

# ==========================================
# 2. MODIFY — PATCH existing queue parameters
# ==========================================
- name: "[MODIFY] Patch queue parameters"
  ansible.builtin.uri:
    url: "http://{{ ansible_host }}:{{ semp_port }}/SEMP/v2/config/msgVpns/{{ json_data.vpn_name }}/queues/{{ json_data.queue_name }}"
    method: PATCH
    user: "{{ semp_user }}"
    password: "{{ semp_pass }}"
    force_basic_auth: yes
    body_format: json
    body:
      accessType: "{{ json_data.access_type | default(omit) }}"
      maxSpoolUsage: "{{ json_data.max_spool_usage_mb | default(omit) }}"
      maxMsgSize: "{{ json_data.max_msg_size_bytes | default(omit) }}"
      maxTtl: "{{ json_data.max_ttl_seconds | default(omit) }}"
      respectTtlEnabled: "{{ json_data.respect_ttl | default(omit) }}"
      maxRedeliveryCount: "{{ json_data.max_redelivery_count | default(omit) }}"
      redeliveryEnabled: "{{ json_data.redelivery_enabled | default(omit) }}"
      deadMsgQueue: "{{ json_data.dead_letter_queue | default(omit) }}"
      ingressEnabled: "{{ json_data.ingress_enabled | default(omit) }}"
      egressEnabled: "{{ json_data.egress_enabled | default(omit) }}"
    status_code: [200, 400]
  when:
    - "'MODIFY' in file_name"
    - json_data.vpn_name is defined
    - json_data.queue_name is defined
  register: modify_result

- name: "[MODIFY] Report result"
  ansible.builtin.debug:
    msg: "{{ file_name }}: HTTP {{ modify_result.status }} — {{ modify_result.json | default(modify_result.content) | default('no body') }}"
  when: modify_result is defined and modify_result.status is defined

# ==========================================
# 3. Topic subscription bindings (CREATE only)
# ==========================================
- name: "[BIND] Map topic subscriptions onto queue"
  ansible.builtin.uri:
    url: "http://{{ ansible_host }}:{{ semp_port }}/SEMP/v2/config/msgVpns/{{ json_data.vpn_name }}/queues/{{ json_data.queue_name }}/subscriptions"
    method: POST
    user: "{{ semp_user }}"
    password: "{{ semp_pass }}"
    force_basic_auth: yes
    body_format: json
    body:
      subscriptionTopic: "{{ item }}"
    status_code: [200, 400]
  loop: "{{ json_data.topic_subscriptions | default([]) }}"
  when:
    - "'CREATE' in file_name"
    - json_data.vpn_name is defined
    - json_data.queue_name is defined
    - json_data.topic_subscriptions is defined
